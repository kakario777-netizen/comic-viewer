name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    # 내 저장소에서만 (포크·외부 풀 리퀘스트로는 실행 안 됨 — pull_request 트리거도 없음)
    if: github.repository == 'kakario777-netizen/comic-viewer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4   # 빌드 캐시 포함
        with:
          gradle-version: 8.11.1

      - name: Restore signing key (from Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.CV_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::서명 키 Secret(CV_KEYSTORE_B64)이 없어요 — 저장소 Settings > Secrets에 추가해 주세요"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          echo "CV_KEYSTORE_PATH=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          CV_KEYSTORE_PASSWORD: ${{ secrets.CV_KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.keystore"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk comic-viewer.apk

      - name: Publish to Releases (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest comic-viewer.apk \
            --title "최신 빌드 #${{ github.run_number }}" \
            --notes "커밋: ${{ github.sha }} — 폰에서 comic-viewer.apk를 눌러 받아 설치하세요." \
            --target ${{ github.sha }}
